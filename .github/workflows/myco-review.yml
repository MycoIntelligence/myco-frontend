name: Myco PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  little-my-review:
    name: Little My Primary Review
    runs-on: ubuntu-latest
    outputs:
      escalation_required: ${{ steps.run_little_my.outputs.escalation_required }}
      escalation_reason: ${{ steps.run_little_my.outputs.escalation_reason }}
      little_my_status: ${{ steps.run_little_my.outputs.little_my_status }}
      findings_count: ${{ steps.run_little_my.outputs.findings_count }}
      is_clean: ${{ steps.run_little_my.outputs.is_clean }}
      is_merge_blocking: ${{ steps.run_little_my.outputs.is_merge_blocking }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Little My Code Review
        id: run_little_my
        run: |
          python3 -m pipeline.pr_reviewer

      - name: Report Little My Execution
        run: |
          echo "Little My Status: ${{ steps.run_little_my.outputs.little_my_status }}"
          echo "Escalation Required: ${{ steps.run_little_my.outputs.escalation_required }}"
          echo "Escalation Reason: ${{ steps.run_little_my.outputs.escalation_reason }}"
          echo "Findings Count: ${{ steps.run_little_my.outputs.findings_count }}"

  myco-review:
    name: Myco Fallback Review
    runs-on: ubuntu-latest
    needs: little-my-review
    # Conditionally execute Myco ONLY when Little My explicitly escalates
    if: always() && needs.little-my-review.outputs.escalation_required == 'true'
    steps:
      - name: Validate Myco Configuration
        id: validate_config
        run: |
          python3 -c "
          import os, sys
          missing = []
          if not os.environ.get('MYCO_LLM_API_KEY'):
              missing.append('MYCO_LLM_API_KEY (secret)')
          if not os.environ.get('MYCO_METRICS_API_KEY'):
              missing.append('MYCO_METRICS_API_KEY (secret)')
          if not os.environ.get('MYCO_METRICS_ENDPOINT'):
              missing.append('MYCO_METRICS_ENDPOINT (variable)')
          if not os.environ.get('MYCO_CLIENT_ID'):
              missing.append('MYCO_CLIENT_ID (variable)')
          if missing:
              print(f'Error: Missing required Myco configuration: {\", \".join(missing)}', file=sys.stderr)
              print('Please configure under GitHub Repository -> Settings -> Secrets and variables -> Actions.', file=sys.stderr)
              sys.exit(1)
          print('Myco configuration validated successfully.')
          "
        env:
          MYCO_LLM_API_KEY: ${{ secrets.MYCO_LLM_API_KEY }}
          MYCO_METRICS_API_KEY: ${{ secrets.MYCO_METRICS_API_KEY }}
          MYCO_METRICS_ENDPOINT: ${{ vars.MYCO_METRICS_ENDPOINT }}
          MYCO_CLIENT_ID: ${{ vars.MYCO_CLIENT_ID }}

      - name: Invoke Official Myco Action
        id: official_myco_action
        uses: MycoIntelligence/myco-bundled-action@v1
        with:
          pr_link: ${{ github.event.pull_request.html_url }}
          api_key: ${{ secrets.MYCO_LLM_API_KEY }}
          metrics_endpoint: ${{ vars.MYCO_METRICS_ENDPOINT }}
          metrics_api_key: ${{ secrets.MYCO_METRICS_API_KEY }}
          client_id: ${{ vars.MYCO_CLIENT_ID }}

      - name: Fallback Failure Notice
        if: failure()
        run: |
          echo "Warning: Myco fallback review could not complete."
          echo "Little My status: ${{ needs.little-my-review.outputs.little_my_status }}"
          echo "Little My findings count: ${{ needs.little-my-review.outputs.findings_count }}"
          echo "Little My findings remain available. Please verify Myco collaborator access or API availability."
